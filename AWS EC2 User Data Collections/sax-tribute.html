    <style>
        body{margin:0;height:100vh;overflow:hidden;background:#000;color:#FFD700;font-family:'Georgia',serif;text-shadow:2px 2px 4px rgba(0,0,0,.8);}
        .slideshow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden;}
        .slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;background-size:cover;background-position:center;will-change:transform,opacity;}
        @keyframes zoomPanIn{
            0%{opacity:0;transform:scale(1) translate(0,0);}
            FADE_END%{opacity:1;transform:scale(1) translate(0,0);}
            DISPLAY_END%{opacity:1;transform:scale(1.07) translate(-2%,2%);}
            PERCENT_PER_SLIDE%{opacity:0;transform:scale(1.07) translate(-2%,2%);}
            100%{opacity:0;}
        }
        @keyframes zoomPanOut{
            0%{opacity:0;transform:scale(1.07) translate(2%,-2%);}
            FADE_END%{opacity:1;transform:scale(1.07) translate(2%,-2%);}
            DISPLAY_END%{opacity:1;transform:scale(1) translate(0,0);}
            PERCENT_PER_SLIDE%{opacity:0;transform:scale(1) translate(0,0);}
            100%{opacity:0;}
        }
        .container{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;height:100vh;padding:20px;}
        .text-container{text-align:center;background:rgba(0,0,0,.5);padding:30px;border-radius:15px;max-width:800px;}
        h1{font-size:2.8em;margin-bottom:20px;}
        p{font-size:1.4em;line-height:1.6;}
        .sax-note{font-size:3em;margin:20px 0;}
